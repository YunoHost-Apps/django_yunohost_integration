
name: tests
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 8 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.13", "3.12"]
    steps:
    - name: Checkout
      run: |
        echo $GITHUB_REF $GITHUB_SHA
        git clone https://github.com/$GITHUB_REPOSITORY.git .
        git fetch origin $GITHUB_SHA:temporary-ci-branch
        git checkout $GITHUB_SHA || (git fetch && git checkout $GITHUB_SHA)

    - name: 'Set up Python ${{ matrix.python-version }}'
      uses: actions/setup-python@main
      # https://github.com/marketplace/actions/setup-python
      with:
        python-version: '${{ matrix.python-version }}'
        cache: 'pip' # caching pip dependencies
        cache-dependency-path: '**/requirements.*.txt'

    - name: Install uv and set the Python version
      # https://docs.astral.sh/uv/guides/integration/github/#multiple-python-versions
      uses: astral-sh/setup-uv@main
      with:
        python-version: ${{ matrix.python-version }}
    - name: 'Bootstrap dev venv'
      # The first CLI call will create the .venv
      run: |
        ./dev-cli.py version

    - name: 'dev CLI help'
      run: |
        ./dev-cli.py --help

    - name: 'Run pip-audit'
      run: |
        ./dev-cli.py pip-audit

    - name: 'Run tests with Python v${{ matrix.python-version }}'
      env:
        PYTHONUNBUFFERED: 1
        PYTHONWARNINGS: always
      run: |
        ./dev-cli.py coverage

    - name: 'Upload coverage report'
      uses: codecov/codecov-action@main
      # https://github.com/marketplace/actions/codecov
      with:
        # https://docs.codecov.com/docs/codecov-tokens#example-github-actions--official-codecov-action
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage artifact
      if: >
        matrix.python-version == '3.13' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-python
        path: coverage.xml

  upload-coverage-python:
    needs: test
    if: >
      !cancelled() &&
      needs.test.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: coverage-report-python
      - uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage-agent
